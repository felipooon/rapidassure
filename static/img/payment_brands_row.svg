    <path d="M5.3 4H0.1L0 4.3C1.8 4.8 3.5 5.4 4.8 6.3C5.6 6.8 5.8 7.2 6.1 8L8.3 15H11.5L14.7 4H10.5L8.3 12.3L7 5.5C6.8 4.6 6.1 4 5.3 4Z" fill="#FAA61A"/>
  </g>

  <!-- 3. Logo Mastercard (Círculos Rojo y Amarillo Solapados) -->
  <g transform="translate(166, 4)">
    <circle cx="12" cy="12" r="11" fill="#EB001B"/>
    <circle cx="22" cy="12" r="11" fill="#F79E1B"/>
    <path d="M17 3.2A11 11 0 0 0 17 20.8A11 11 0 0 0 17 3.2Z" fill="#FF5F00"/>
  </g>

  <!-- 4. Logo MAGNA (Insignia Azul con Texto Blanco) -->
  <g transform="translate(208, 6)">
    <rect x="0" y="0" width="46" height="20" rx="3" fill="#0038FF"/>
    <text x="23" y="14" font-family="'Montserrat', sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5px">MAGNA</text>
  </g>

  <!-- 5. Logo Redcompra (Insignia Roja y Azul con Texto Itálico Blanco) -->
  <g transform="translate(262, 6)">
    <!-- Mitad Izquierda Roja -->
    <path d="M0 3C0 1.34315 1.34315 0 3 0H35V20H0V3Z" fill="#E50043"/>
    <!-- Mitad Derecha Azul -->
    <path d="M35 0H72C73.6569 0 75 1.34315 75 3V17C75 18.6569 73.6569 20 72 20H35V0Z" fill="#001A72"/>
    <!-- Líneas de velocidad Rojas a la izquierda -->
    <line x1="4" y1="6" x2="14" y2="6" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="2" y1="10" x2="14" y2="10" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4" y1="14" x2="14" y2="14" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Texto Redcompra -->
    <text x="44" y="14" font-family="'Montserrat', sans-serif" font-style="italic" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">Red compra</text>
  </g>
