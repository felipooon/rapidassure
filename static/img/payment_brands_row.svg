<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 32" width="340" height="32">
  <!-- 1. Logo Transbank (Texto Magenta Oficial con punto) -->
  <g transform="translate(0, 4)">
    <text x="0" y="18" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#E50043" letter-spacing="-0.5px">transbank<tspan fill="#E50043">.</tspan></text>
  </g>

